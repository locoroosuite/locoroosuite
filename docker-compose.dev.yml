services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locoroomail-dev
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "8001:8001"
    env_file: .env
    environment:
      - COLLABORA_URL=http://collabora:9980
      - COLLABORA_INTERNAL_URL=http://collabora:9980
      - COLLABORA_PUBLIC_URL=http://localhost:9980
      - WOPI_HOST_URL=http://app:5001
      - MAIL_API_URL=http://mail-api:8800
      - MAIL_API_KEY=${MAIL_API_KEY:-dev-mail-api-secret}
      - SERVER_NAME=${SERVER_NAME:-}
      - FLASK_BACKEND_URL=http://localhost:5001
      - NGROK_URL=${NGROK_URL:-}
    volumes:
      - ./data:/app/data
    depends_on:
      mail-api:
        condition: service_healthy
      dovecot:
        condition: service_started
      postfix:
        condition: service_started
    networks:
      - locoroomail-dev

  mail-api:
    build:
      context: ./mail-api
      dockerfile: Dockerfile
    container_name: locoroomail-mail-api
    restart: unless-stopped
    ports:
      - "8800:8800"
    environment:
      - MAIL_API_SETTINGS=/app/settings.cfg
      - MAIL_API_KEY=${MAIL_API_KEY:-dev-mail-api-secret}
    volumes:
      - dovecot-users:/var/lib/dovecot-users
      - maildata:/var/mail/vhosts
      - postfix-config:/etc/postfix
      - opendkim-keys:/etc/opendkim/keys
      - opendkim-config:/etc/opendkim
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8800/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - dovecot
      - postfix
    networks:
      - locoroomail-dev

  dovecot:
    build:
      context: ./dev-infra/dovecot
      dockerfile: Dockerfile
    container_name: locoroomail-dovecot
    restart: unless-stopped
    ports:
      - "143:143"
      - "993:993"
    environment:
      - JUNK_RETENTION=${JUNK_RETENTION:-30d}
      - TRASH_RETENTION=${TRASH_RETENTION:-30d}
    volumes:
      - dovecot-users:/var/lib/dovecot-users
      - maildata:/var/mail/vhosts
      - dovecot-sieve:/var/lib/dovecot-sieve
      - postfix-spool:/var/spool/postfix
    depends_on:
      - rspamd
    networks:
      - locoroomail-dev

  rspamd:
    build:
      context: ./dev-infra/rspamd
      dockerfile: Dockerfile
    container_name: locoroomail-rspamd
    restart: unless-stopped
    ports:
      - "127.0.0.1:11334:11334"
    volumes:
      - rspamd-data:/var/lib/rspamd
    depends_on:
      - redis
    networks:
      - locoroomail-dev

  redis:
    image: redis:alpine
    container_name: locoroomail-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - locoroomail-dev

  postfix:
    build:
      context: ./dev-infra/postfix
      dockerfile: Dockerfile
    container_name: locoroomail-postfix
    restart: unless-stopped
    ports:
      - "25:25"
      - "587:587"
    volumes:
      - postfix-config:/etc/postfix
      - postfix-spool:/var/spool/postfix
    depends_on:
      - dovecot
      - opendkim
      - rspamd
    networks:
      - locoroomail-dev

  opendkim:
    build:
      context: ./dev-infra/opendkim
      dockerfile: Dockerfile
    container_name: locoroomail-opendkim
    restart: unless-stopped
    volumes:
      - opendkim-keys:/etc/opendkim/keys
      - opendkim-config:/etc/opendkim
    networks:
      - locoroomail-dev

  collabora:
    # Pinned by digest (CODE 25.04.9.4): the floating :latest tag broke
    # background conversion on 2026-09-26 after an upstream rebuild.
    image: collabora/code@sha256:fe49c08c27e102c1877ad4ef2ac1a7bd8ccd2dfaa6641d4533389c204a92bb88
    container_name: locoroomail-collabora
    restart: unless-stopped
    environment:
      - aliasgroup1=http://app:5001
      - extra_params=--o:ssl.enable=false --o:ssl.termination=false --o:net.frame_ancestors=http://localhost:5001 --o:welcome.enable=false --o:ui.about.enabled=false --o:productbranding.logoLink=http://localhost:5001/app/docs/
    # convert-to spawns jailed worker processes: the forkit needs mount(2) +
    # unshare(CLONE_NEWNS) (coolmount/systemplate cloning). Neither
    # cap_add: [SYS_ADMIN] + seccomp/apparmor=unconfined nor userns tricks
    # satisfied this host (CapEff stayed 0, CLONE_NEWNS -> EPERM), so the dev
    # stack runs the container privileged. Dev-only: never copy this to prod.
    privileged: true
    expose:
      - "9980"
    ports:
      - "9980:9980"
    networks:
      - locoroomail-dev

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: locoroomail-radicale
    restart: unless-stopped
    ports:
      - "5232:5232"
    volumes:
      - ./data/radicale:/data
    networks:
      - locoroomail-dev

  synapse:
    build:
      context: ./dev-infra/synapse
      dockerfile: Dockerfile
    container_name: locoroomail-synapse
    restart: unless-stopped
    ports:
      - "8008:8008"
    volumes:
      - synapse-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - locoroomail-dev

  # Matrix Authentication Service: the chat module provisions and logs in
  # users through its admin API and compat layer (HLD U25.4/U25.6). Synapse
  # delegates authentication to it. Config is host-mounted (read-only), the
  # same pattern as the production deployment; mas-cli server applies DB
  # migrations and syncs the config into the database on startup.
  mas:
    image: ghcr.io/element-hq/matrix-authentication-service:1.24.0
    container_name: locoroomail-mas
    restart: unless-stopped
    command: ["server", "-c", "/config/config.yaml"]
    ports:
      - "8088:8080"
    volumes:
      - ./dev-infra/mas:/config:ro
    depends_on:
      mas-db:
        condition: service_healthy
    networks:
      - locoroomail-dev

  mas-db:
    image: postgres:16-alpine
    container_name: locoroomail-mas-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mas
      - POSTGRES_PASSWORD=devmas
      - POSTGRES_DB=mas
    volumes:
      - mas-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - locoroomail-dev

  # TURN server for 1:1 WebRTC calls (HLD U25.21). Dev domain config
  # (Admin → Domains → chat settings): host `coturn`, port 3478, shared
  # secret `dev-turn-secretsdfopk234098324kojwsderfjkfsjkldf` (>= 16 chars: shorter secrets fail the
  # admin save validation). The host must be the compose DNS name because the
  # admin save's authenticated Allocate probe runs from the app container
  # (the published ports are NOT reachable as `localhost` from inside it);
  # browsers on the same host fall back to direct host-candidate connections.
  # The app never talks to coturn — it only mints ephemeral credentials from
  # the shared secret.
  coturn:
    build:
      context: ./dev-infra/coturn
      dockerfile: Dockerfile
    container_name: locoroomail-coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "49160-49200:49160-49200/udp"
    volumes:
      - coturn-tls:/data/tls
    networks:
      - locoroomail-dev

volumes:
  dovecot-users:
  dovecot-sieve:
  postfix-config:
  postfix-spool:
  maildata:
  opendkim-keys:
  opendkim-config:
  synapse-data:
  mas-db-data:
  coturn-tls:
  rspamd-data:
  redis-data:

networks:
  locoroomail-dev:
    driver: bridge
