mail_home = /var/mail/vhosts/%d/%n
# 2.4 split mail_location into mail_driver + mail_path
mail_driver = maildir
mail_path = /var/mail/vhosts/%d/%n
mail_plugins = quota
mail_privileged_group = vmail
first_valid_uid = 5000
last_valid_uid = 5000
first_valid_gid = 5000
last_valid_gid = 5000
mmap_disable = no
