# Mirror of production /etc/dovecot/conf.d/90-sieve.conf (sieve_before entries).
# The scripts live inside the image at /var/lib/dovecot/sieve/ (same path as
# production); the per-user sieve storage volume (/var/lib/dovecot-sieve) is a
# different, dedicated path - see the comment in dovecot.conf.
plugin {
  sieve_before = /var/lib/dovecot/sieve/global-spam.sieve
}
