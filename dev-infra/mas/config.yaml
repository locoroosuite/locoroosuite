passwords:
  enabled: true
  minimum_complexity: 3
  schemes:
    - version: 1
      algorithm: bcrypt
      unicode_normalization: true
    - version: 2
      algorithm: argon2id

account:
  # No open signup in dev either: accounts are provisioned by the app through
  # the admin API.
  password_registration_enabled: false
  registration_token_required: false

email:
  from: '"Matrix Dev" <matrix@locoroo.test>'
  reply_to: '"Matrix Dev" <matrix@locoroo.test>'
  transport: blackhole

branding:
  service_name: LocoRoo Dev Chat

telemetry:
  tracing:
    exporter: none
  metrics:
    exporter: none
