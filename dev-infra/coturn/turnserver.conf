# Dev TURN server config (HLD U25.21). Production deploys its own coturn;
# see docs/chat-prod-integration.md.

# Listeners: standard STUN/TURN port and the TLS (DTLS over TURN/TCP) port.
listening-port=3478
tls-listening-port=5349

# REST API ephemeral credentials (RFC 8489 auth-secret mechanism): the app
# mints time-limited username/password pairs from this shared secret. It must
# match the domain's `turn_shared_secret` admin setting and pass the app's
# validation (>= 16 chars). static-auth-secret implies lt-cred-mech; setting
# both makes coturn warn and breaks REST-credential authentication.
static-auth-secret=dev-turn-secretsdfopk234098324kojwsderfjkfsjkldf
realm=turn.localhost

# Bounded UDP relay range — must match the published port range in
# docker-compose.dev.yml.
min-port=49160
max-port=49200

# Dev-only relaxations: both browsers typically run on localhost, and coturn
# refuses to relay traffic to loopback/private addresses by default, which
# would make every dev call fail once the relay path is used. NEVER enable
# these in production.
allow-loopback-peers
no-stun-backward-compatibility

# TLS listener cert (generated on first start by entrypoint.sh).
cert=/data/tls/cert.pem
pkey=/data/tls/pkey.pem
no-tlsv1
no-tlsv1_1

no-cli
# Dev: verbose so Allocate failures are diagnosable from `docker logs`.
verbose
