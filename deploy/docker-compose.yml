services:
  app:
    build: ..
    container_name: locoroomail
    restart: unless-stopped
    env_file: .env
    environment:
      - COLLABORA_INTERNAL_URL=http://collabora:9980
      - COLLABORA_PUBLIC_URL=https://${SERVER_NAME}/collabora
      - WOPI_HOST_URL=https://${SERVER_NAME}
    volumes:
      - ../data:/app/data
    depends_on:
      - collabora
    networks:
      - locoroomail

  collabora:
    # Pinned to a release tag (refreshed 2026-11-19) so upgrades are
    # deliberate and the audit (`make images-audit`) can track them.
    image: collabora/code:26.04.6.1.1
    container_name: locoroomail-collabora
    restart: unless-stopped
    environment:
      - aliasgroup1=https://${SERVER_NAME}:443
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:security.capabilities=true --o:welcome.enable=false --o:ui.about.enabled=false --o:productbranding.logoLink=https://${SERVER_NAME}/app/docs/
    cap_add:
      - MKNOD
    expose:
      - "9980"
    networks:
      - locoroomail

  nginx:
    # Stable-branch track tag (currently 1.30.x — carries the 2026-11-18
    # "nginx2root" security fixes, CVE-2026-123007 et al.). Floating
    # :alpine/:latest resolves per-pull and made upgrades accidental; the
    # stable branch gets security patches without mainline behavior changes.
    # Refresh deliberately via `make images-audit` (HLD U26.11).
    image: nginx:1.30-alpine
    container_name: locoroomail-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - collabora
    networks:
      - locoroomail

networks:
  locoroomail:
    driver: bridge
