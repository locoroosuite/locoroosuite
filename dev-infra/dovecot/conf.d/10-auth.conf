# 2.4 renamed disable_plaintext_auth (inverted) to auth_allow_cleartext.
# Dev-only relaxation, same semantics as the old disable_plaintext_auth = no.
auth_allow_cleartext = yes
auth_mechanisms = plain login
# Byte-exact username lookups in the passwd file (was username_format=%u in
# the 2.3 passdb/userdb args; 2.4 default lowercases via %{user | lower}).
# 2.4 variable syntax: %{user} is the full unchanged username.
auth_username_format = %{user}

!include auth-passwdfile.conf.ext
