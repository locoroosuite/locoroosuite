# Mirror of production /etc/dovecot/conf.d/90-imap-sieve.conf (2026-09-26):
# IMAPSieve trains rspamd when messages are COPY'd to/from the Junk folder.
# COPY cause only (no FLAG) - one learn per move, no double-learn from flag
# toggles. The pipe scripts call the rspamd controller over HTTP (curl)
# instead of rspamc because rspamc is not available inside the Dovecot image;
# both hit the same controller endpoints.
plugin {
  sieve_plugins = sieve_extprograms sieve_imapsieve
  sieve_extensions = +vnd.dovecot.pipe
  sieve_pipe_bin_dir = /var/lib/dovecot/sieve/pipe

  # Move into Junk -> learn as spam
  imapsieve_mailbox1_name = Junk
  imapsieve_mailbox1_causes = COPY
  imapsieve_mailbox1_before = file:/var/lib/dovecot/sieve/learn-spam.sieve

  # Move out of Junk -> learn as ham
  imapsieve_mailbox2_name = *
  imapsieve_mailbox2_from = Junk
  imapsieve_mailbox2_causes = COPY
  imapsieve_mailbox2_before = file:/var/lib/dovecot/sieve/learn-ham.sieve
}
