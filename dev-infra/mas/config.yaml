# Dev-only MAS (Matrix Authentication Service) configuration.
# Dev secrets are intentionally fixed; production must generate its own.
#
# Requires a PostgreSQL database (mas-db service in docker-compose.dev.yml);
# `mas-cli server` applies database migrations and syncs clients/policy into
# the database automatically on startup.
#
# The locoroomail app provisions and logs in chat users through this service:
#  - admin API on /api/admin/v1 (OAuth client below, client-credentials grant,
#    scope urn:mas:admin) — matches the dev domain defaults in
#    app/admin/controllers/auth.py
#  - Matrix compat login on /_matrix/client/v3/login (m.login.password)
http:
  public_base: "http://mas:8080/"
  listeners:
    - name: web
      resources:
        - name: discovery
        - name: human
        - name: oauth
        - name: compat
        - name: graphql
        - name: assets
        - name: adminapi
      binds:
        - host: 0.0.0.0
          port: 8080
      proxy_protocol: false
    - name: internal
      resources:
        - name: health
      binds:
        - host: localhost
          port: 8081
      proxy_protocol: false
  trusted_proxies:
    - 192.168.0.0/16
    - 172.16.0.0/12
    - 10.0.0.0/8
    - 127.0.0.0/8
    - fd00::/8
    - ::1/128

database:
  uri: postgresql://mas:devmas@mas-db:5432/mas
  max_connections: 10
  min_connections: 0
  connect_timeout: 30
  idle_timeout: 600
  max_lifetime: 1800

matrix:
  kind: synapse
  homeserver: locoroo.test
  endpoint: "http://synapse:8008/"
  secret: "dev-mas-synapse-secret"

# The locoroomail app's provisioning client. Listed in policy.data.admin_clients
# so the client-credentials grant can request the urn:mas:admin scope.
clients:
  - client_id: 01MAS00000000000000000000A
    client_auth_method: client_secret_basic
    client_secret: dev-mas-client-secret

policy:
  data:
    admin_clients:
      - 01MAS00000000000000000000A

