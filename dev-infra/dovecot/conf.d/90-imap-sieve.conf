# Mirror of production /etc/dovecot/conf.d/90-imap-sieve.conf (2026-09-26):
# IMAPSieve trains rspamd when messages are COPY'd to/from the Junk folder.
# COPY cause only (no FLAG) - one learn per move, no double-learn from flag
# toggles. The pipe scripts call the rspamd controller over HTTP (curl)
# instead of rspamc because rspamc is not available inside the Dovecot image;
# both hit the same controller endpoints.
#
# Dovecot 2.4 syntax: sieve_plugins/sieve_extensions are named blocks, and the
# old imapsieve_mailbox{N}_* settings became mailbox { } blocks (events INTO
# the mailbox) and imapsieve_from { } blocks (events OUT of the mailbox).
sieve_plugins {
  sieve_extprograms = yes
  sieve_imapsieve = yes
}
sieve_extensions {
  vnd.dovecot.pipe = yes
}
sieve_pipe_bin_dir = /var/lib/dovecot/sieve/pipe

# Move into Junk -> learn as spam
mailbox Junk {
  sieve_script learn-spam {
    type = before
    cause = copy
    path = /var/lib/dovecot/sieve/learn-spam.sieve
  }
}

# Move out of Junk -> learn as ham
imapsieve_from Junk {
  sieve_script learn-ham {
    type = before
    cause = copy
    path = /var/lib/dovecot/sieve/learn-ham.sieve
  }
}
