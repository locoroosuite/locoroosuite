# Dev-only Synapse homeserver configuration (seeded into /data on first start).
# Dev secrets are intentionally fixed; production must generate its own.
server_name: "locoroo.test"
pid_file: /data/homeserver.pid
signing_key_path: /data/homeserver.signing.key

listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    bind_addresses: ["0.0.0.0"]
    resources:
      - names: [client]
        compress: false

database:
  name: sqlite3
  args:
    database: /data/homeserver.db

# Delegated authentication: Synapse disables its own shared-secret
# registration and password login; the locoroomail app provisions and logs in
# users through MAS (dev-infra/mas). The secret must match matrix.secret in
# the MAS config.
matrix_authentication_service:
  enabled: true
  endpoint: "http://mas:8080/"
  secret: "dev-mas-synapse-secret"

enable_registration: false
enable_registration_without_verification: false

# No federation resource on any listener -> inbound federation disabled.
# Empty federation whitelist disables outbound federation.
federation_domain_whitelist: []

macaroon_secret_key: "dev_macaroon_secret_key_locoroo_0123456789abcdef"
form_secret: "dev_form_secret_locoroo_0123456789abcdef"

media_store_path: /data/media_store
max_upload_size: 50M
report_stats: false
trusted_key_servers: []
enable_room_list_search: true

# Chat user discovery is database-backed in the app (HLD U25.8); the Synapse
# user directory is not used for it.
