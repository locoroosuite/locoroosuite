<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — LocoRooSuite</title>
  <link rel="stylesheet" href="/static/css/tailwind.css" />
</head>
<body class="h-full text-slate-900 antialiased">
  <div class="min-h-full flex items-center justify-center px-4">
    <div class="max-w-sm w-full text-center py-16">
      <div class="mx-auto h-14 w-14 rounded-2xl bg-slate-900 text-white text-lg font-semibold grid place-items-center">LR</div>
      <h1 class="mt-6 text-xl font-semibold">You're offline</h1>
      <p class="mt-2 text-sm text-slate-600">
        LocoRooSuite needs a connection to load your mail. Check your network and try again.
      </p>
      <div class="mt-6 flex items-center justify-center gap-3">
        <button type="button" onclick="location.reload()"
          class="rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white hover:bg-slate-800 transition-colors">
          Try again
        </button>
        <a href="/app/mail/"
          class="rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 hover:bg-slate-50 transition-colors">
          Go to mail
        </a>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
